[logging]
level="DEBUG"

[bootstrap]
client_scene="res://scenes/bootstrap/ClientBootstrap.tscn"
server_scene="res://scenes/bootstrap/DedicatedServerBootstrap.tscn"
local_debug_scene="res://scenes/bootstrap/LocalDebugBootstrap.tscn"

[network]
listen_port=7777
server_port=7777
server_host="127.0.0.1"
max_clients=8

[match]
default_match_id="main"
default_map_preset_id="map_preset.sandbox_64"

[board_actions]
default_tile_hp = 1
reveal_tick_interval_sec = 0.20
reveal_damage_per_tick = 1
claim_duration_ms = 30000
final_rush_damage_multiplier = 2.0

[player]
display_name="DevClient"

[client_world]
scene_path = "res://scenes/world/ClientSandboxWorld.tscn"
player_avatar_scene_path = "res://scenes/world/replicas/PlayerReplicaAvatar.tscn"
board_view_scene_path = "res://scenes/world/board/BoardGridView3D.tscn"

ground_size = 256.0
ground_height = 0.2
ground_surface_clearance = 0.06
ground_color = #2e4728
ambient_light_energy = 0.85
sun_light_energy = 1.2
sun_rotation_x_degrees = -55.0
sun_rotation_y_degrees = 35.0
player_body_height = 1.8
player_body_radius = 0.45

[camera_rig]
camera_distance = 6.0
camera_height = 8.0
look_at_height = 0.8
follow_lerp_speed = 8.0
camera_near = 0.35
camera_far = 180.0

[rendering_3d]
msaa_3d = "4x"
screen_space_aa = "smaa"
use_taa = false

[board_view]
tile_size = 1.0
tile_height = 0.18
tile_gap = 0.001
base_thickness = 0.12
base_color = #182027
hidden_tile_color = #6f6658
revealed_tile_color = #c8ae79
claimed_tile_color = #d6b24c
chunk_line_width = 0.04
chunk_line_height = 0.03
chunk_line_surface_lift = 0.02
chunk_line_color = #a9d0ff
show_chunk_lines = true
show_reveal_underlay = true
reveal_underlay_surface_lift = 0.005
reveal_underlay_subdivide_width = 4
reveal_underlay_subdivide_depth = 4
reveal_underlay_flip_v = false
show_cleared_tiles_without_underlay = true
show_cleared_tiles_with_underlay = false

[replication]
player_transform_interval_sec=0.100

[spawn_layout]
base_radius=6.0
ring_spacing=4.0
slots_in_inner_ring=8
vertical_offset=0.0

[content_directories]
map_presets="res://data/map_presets"
roles="res://data/roles"
items="res://data/items"
tile_behaviors="res://data/tile_behaviors"
tile_families="res://data/tile_families"
tile_variants="res://data/tile_variants"
tuning="res://data/tuning"
