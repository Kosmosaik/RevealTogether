[logging]
level="DEBUG"

[bootstrap]
client_scene="res://scenes/bootstrap/ClientBootstrap.tscn"
server_scene="res://scenes/bootstrap/DedicatedServerBootstrap.tscn"
local_debug_scene="res://scenes/bootstrap/LocalDebugBootstrap.tscn"

[network]
listen_port=7777
server_port=7777
server_host="127.0.0.1"
max_clients=8

[match]
default_match_id="main"
default_map_preset_id="map_preset.sandbox_64"

[player]
display_name="DevClient"

[client_world]
