player_avatar_scene_path="res://scenes/world/replicas/PlayerReplicaAvatar.tscn"
ground_size_x=64.0
ground_size_z=64.0
ground_height=0.5
camera_height=26.0
camera_distance=18.0
camera_follow_lerp_rate=8.0
camera_target_height=0.0
player_body_height=1.8
player_body_radius=0.45

[replication]
player_transform_interval_sec=0.100

[spawn_layout]
base_radius=6.0
ring_spacing=4.0
slots_in_inner_ring=8
vertical_offset=0.0
